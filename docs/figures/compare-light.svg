<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect x="0.5" y="0.5" width="879.0" height="249.0" rx="12" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>
<text x="28.0" y="40.0" font-size="16" font-weight="600" text-anchor="start" fill="#0b0b0b">The same brightness, reached two ways</text>
<text x="28.0" y="62.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">One run at 100 frames a second and 1/200 s. Dimming the picture instead of the panel changes nothing.</text>
<text x="320.0" y="102.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">600 nits</text>
<rect x="263.0" y="113.0" width="114.0" height="44.0" rx="3" fill="#86b6ef"/>
<text x="320.0" y="185.0" font-size="13" font-weight="400" text-anchor="middle" fill="#898781">–</text>
<text x="436.0" y="102.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">140 nits</text>
<rect x="379.0" y="113.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<rect x="379.0" y="159.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<text x="552.0" y="102.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">80 nits</text>
<rect x="495.0" y="113.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<rect x="495.0" y="159.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<text x="668.0" y="102.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">45 nits</text>
<rect x="611.0" y="113.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<rect x="611.0" y="159.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<text x="784.0" y="102.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">15 nits</text>
<rect x="727.0" y="113.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<rect x="727.0" y="159.0" width="114.0" height="44.0" rx="3" fill="#104281"/>
<text x="28.0" y="133.0" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">The panel dimmed</text>
<text x="28.0" y="150.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">a white field</text>
<text x="28.0" y="179.0" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">The panel at 100%</text>
<text x="28.0" y="196.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">a grey of the same nits</text>
<text x="28.0" y="224.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">Flicker</text>
<rect x="80.0" y="214.0" width="12.0" height="12.0" rx="2" fill="#86b6ef"/>
<text x="98.0" y="224.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">none</text>
<rect x="152.0" y="214.0" width="12.0" height="12.0" rx="2" fill="#2a78d6"/>
<text x="170.0" y="224.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">some</text>
<rect x="224.0" y="214.0" width="12.0" height="12.0" rx="2" fill="#104281"/>
<text x="242.0" y="224.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">strong</text>
</svg>

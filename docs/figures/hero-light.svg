<text x="28" y="42" font-size="11" letter-spacing="0.8" fill="#898781">MACBOOK PRO  ·  PROLED XDR DISPLAY  ·  FILMED WITH AN IPHONE 18 PRO AT 100 FRAMES A SECOND</text>
<text x="26.0" y="114.0" font-size="64" font-weight="700" text-anchor="start" fill="#0b0b0b">≈ 240 Hz</text>
<text x="30.0" y="139.0" font-size="12" font-weight="400" text-anchor="start" fill="#898781">the simplest rate that fits the marks</text>
<text x="344.0" y="94.0" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">The display&#x27;s light pulses at every brightness.</text>
<text x="344.0" y="119.0" font-size="18" font-weight="400" text-anchor="start" fill="#52514e">Nothing tried in software removes it.</text>

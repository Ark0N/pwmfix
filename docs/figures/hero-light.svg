<text x="28.0" y="458.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#898781">Each bar is how long the shutter stays open. The two that fit whole pulses showed no flicker (filmed with the screen dimmed to 45 nits).</text>
<text x="28.0" y="475.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#898781">A drawing: the pulse&#x27;s shape wasn&#x27;t measured. 1/1000 s was filmed on a desktop picture, the rest on a white field.</text>
